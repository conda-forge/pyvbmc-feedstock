{% set name = "pyvbmc" %}
{% set version = "1.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4df52f82b733c8637446bc87beee1115ba32e96cf0915ba67d95e18637c31191

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61
    - setuptools-scm >=6.2
    - pip
  run:
    - python >={{ python_min }}
    - cma >=3.4.0
    - corner >=2.2.1
    - dill >=0.3.5.1
    - filelock >=3.12.1
    - gpyreg >=1.4.0
    - imageio >=2.13.5
    - matplotlib-base >=3.9.0
    - numpy >=2.0.0
    - platformdirs >=3.0.0
    - scipy >=1.15.0
    - threadpoolctl >=3.2.0

test:
  imports:
    - pyvbmc
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/PyVBMC/
  doc_url: https://acerbilab.org/pyvbmc/
  dev_url: https://github.com/acerbilab/pyvbmc/
  summary: Variational Bayesian Monte Carlo in Python.
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - pyvbmc/svbmc/LICENSE.txt

extra:
  recipe-maintainers:
    - Bobby-Huggins
    - lacerbi
    - pipme
